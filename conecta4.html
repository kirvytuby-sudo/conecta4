<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala de Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=Permanent+Marker&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#152331; --muted:#5b6b7b; --line:#d5dde5;
  --board:#1f4e79; --hole:#e3e9ef; --red:#e2483d; --yellow:#f2b52b; --accent:#1f6fb8; --ok:#1c8a5a;
  --marker:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1720; --surface:#17222e; --ink:#e7eef5; --muted:#93a3b3; --line:#2a3846;
  --board:#24527d; --hole:#0d141b; --red:#f05a4f; --yellow:#f5c142; --accent:#5aa6ec; --ok:#3cc28a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:800 clamp(28px,8vw,36px)/1 var(--display);margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
h1 .dots{display:inline-flex;gap:4px}
h1 .dots i{width:14px;height:14px;border-radius:50%;background:var(--red);display:block}
h1 .dots i:nth-child(even){background:var(--yellow)}
h2{font:600 18px/1.2 var(--display);margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 120px;min-width:0}
button{font:700 16px var(--body);border:0;border-radius:10px;padding:13px 16px;cursor:pointer;background:var(--accent);color:#fff;min-height:48px}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,.col:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:700 20px var(--body);letter-spacing:.2em;text-transform:uppercase;text-align:center;border:1.5px solid var(--line);
  border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);min-height:48px;width:100%}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.msg{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--red);font-size:14px;margin:0}
.code{font:800 40px/1 var(--display);letter-spacing:.18em;text-align:center}
.link{font-size:13px;word-break:break-all;text-align:center;color:var(--muted);user-select:all}
.center{text-align:center}

/* Menú */
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;color:var(--ink);text-align:left;
  display:flex;flex-direction:column;gap:6px;min-height:120px;font-weight:500}
.game:hover{border-color:var(--accent)}
.game .ic{font-size:30px;line-height:1}
.game b{font:600 17px/1.2 var(--display)}
.game small{color:var(--muted);font-size:13px;font-weight:500}

/* Cabecera de juego */
.ghead{display:flex;align-items:center;gap:10px}
.ghead h2{flex:1;min-width:0}
.ghead button{min-height:40px;padding:8px 12px;font-size:14px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid transparent;background:var(--surface);min-width:0}
.pl.active{border-color:var(--ink)}
.pl .tok{width:24px;height:24px;flex:none;display:grid;place-items:center;font:800 18px var(--display)}
.pl .n{min-width:0;font-weight:700}
.pl small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.status{font:600 20px/1.2 var(--display);text-align:center;min-height:24px;margin:0}

/* Conecta 4 */
.board{background:var(--board);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(7,1fr);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.col{display:grid;grid-template-rows:repeat(6,1fr);border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.col.can:hover{background:rgba(255,255,255,.08)}
.col:not(.can){cursor:default}
.cell{aspect-ratio:1;padding:5%}
.hole{width:100%;height:100%;border-radius:50%;background:var(--hole);box-shadow:inset 0 3px 4px rgba(0,0,0,.25);position:relative}
.disc{border-radius:50%;display:block}
.hole .disc{position:absolute;inset:0}
.disc.A{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 45%),var(--red)}
.disc.B{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45),transparent 45%),var(--yellow)}
.disc.drop{animation:drop .42s cubic-bezier(.3,0,.5,1.4) both}
@keyframes drop{from{transform:translateY(var(--from))}to{transform:translateY(0)}}
.disc.win{box-shadow:0 0 0 4px var(--surface),0 0 0 7px var(--ink)}

/* Gato */
.gato{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--line);border-radius:16px;padding:8px}
.gcell{aspect-ratio:1;background:var(--surface);border-radius:10px;display:grid;place-items:center;font:800 clamp(48px,16vw,72px)/1 var(--display);
  border:0;padding:0;color:var(--ink);min-height:0}
.gcell.A{color:var(--red)} .gcell.B{color:var(--yellow)}
.gcell.win{background:var(--bg);box-shadow:inset 0 0 0 3px var(--ink)}
.gcell:disabled{opacity:1;cursor:default}
.gcell.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}

/* Piedra papel tijera */
.ppt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ppt button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 6px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-size:14px}
.ppt button span{font-size:40px;line-height:1}
.ppt button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.reveal{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.reveal .big{font-size:52px;line-height:1}
.reveal small{display:block;color:var(--muted);font-size:13px}
.hist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hist i{font-style:normal;font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.hist i.w{background:var(--ok);color:#fff;border-color:transparent}
.hist i.l{background:var(--red);color:#fff;border-color:transparent}

/* Ahorcado */
.hang{display:flex;justify-content:center}
.hang svg{width:150px;height:auto}
.hang .p{stroke:var(--ink);stroke-width:4;stroke-linecap:round;fill:none}
.hang .p.miss{stroke:var(--red)}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font:800 26px/1 var(--display)}
.word span{width:26px;border-bottom:3px solid var(--ink);text-align:center;padding-bottom:4px;min-height:34px}
.word span.sp{border:0;width:12px}
.word span.lost{color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.keys button{min-height:42px;padding:0;font-size:16px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.keys button.hit{background:var(--ok);color:#fff;border-color:transparent;opacity:1}
.keys button.no{background:var(--bg);color:var(--muted);text-decoration:line-through;opacity:1}

/* Batalla naval */
.bn{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--board);border-radius:12px;padding:6px}
.bn .sq{aspect-ratio:1;border:0;border-radius:4px;padding:0;min-height:0;background:color-mix(in srgb,var(--board) 55%,#9cc7f0);
  display:grid;place-items:center;font-size:clamp(12px,4vw,18px);color:#fff}
.bn .sq.ship{background:#7d8b99}
.bn .sq.miss::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(255,255,255,.75)}
.bn .sq.hit{background:var(--red)}
.bn .sq.sunk{background:#3a2a2a}
.bn .sq.can{cursor:pointer}
.bn .sq.can:hover{outline:2px solid #fff}
.bn .sq.lastshot{box-shadow:inset 0 0 0 3px var(--yellow)}
.bn.small{width:100%;max-width:220px;margin:0 auto;gap:2px;padding:4px}
.bn.small .sq{font-size:10px}
.fleetinfo{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}

/* Damas */
.dm{display:grid;grid-template-columns:repeat(8,1fr);border-radius:10px;overflow:hidden;border:4px solid #6b4a2b}
.dm .sq{aspect-ratio:1;display:grid;place-items:center;border:0;border-radius:0;padding:0;min-height:0;background:#ecd9b6}
.dm .sq.dk{background:#8a6240}
.dm .sq.tgt{box-shadow:inset 0 0 0 4px var(--ok);cursor:pointer}
.dm .sq.tgt::after{content:"";width:30%;height:30%;border-radius:50%;background:var(--ok);opacity:.8}
.dm .pc{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font-size:clamp(12px,4vw,20px);color:#fff;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.dm .pc.A{background:var(--red)} .dm .pc.B{background:var(--yellow);color:#4a3200}
.dm .sq.mov .pc{outline:3px solid #fff;cursor:pointer}
.dm .sq.sel .pc{outline:3px solid var(--ok);transform:scale(1.08)}
.dm .sq.last{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.dm .sq.blow{cursor:pointer}
.dm .sq.blow .pc{outline:3px dashed #fff;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(.85)}}
.dm .sq.blown{box-shadow:inset 0 0 0 4px var(--red)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opts button{padding:10px 8px;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
.opts button small{font-weight:500;font-size:11.5px;opacity:.85}

/* Damas chinas y puntos y cajas */
.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.svgbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.cc-hole{fill:var(--hole);stroke:var(--line);stroke-width:.08}
.cc-goalA{fill:color-mix(in srgb,var(--red) 18%,var(--hole))}
.cc-goalB{fill:color-mix(in srgb,var(--yellow) 22%,var(--hole))}
.cc-A{fill:var(--red)} .cc-B{fill:var(--yellow)}
.cc-mov{stroke:var(--ink);stroke-width:.18;cursor:pointer}
.cc-sel{stroke:var(--ok);stroke-width:.32}
.cc-tgt{fill:var(--ok);opacity:.55;cursor:pointer}
.cc-last{stroke:var(--ink);stroke-width:.14;stroke-dasharray:.3 .2}
.db-dot{fill:var(--ink)}
.db-line{stroke-width:2.6;stroke-linecap:round}
.db-A{stroke:var(--red)} .db-B{stroke:var(--yellow)}
.db-hit{stroke:transparent;stroke-width:9;cursor:pointer}
.db-hit:hover + .db-ghost,.db-ghost.show{stroke:var(--muted);opacity:.5}
.db-ghost{stroke:transparent;stroke-width:2;stroke-dasharray:2 2;pointer-events:none}
.db-boxA{fill:color-mix(in srgb,var(--red) 35%,transparent)} .db-boxB{fill:color-mix(in srgb,var(--yellow) 45%,transparent)}
.db-lbl{font:800 7px var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}

/* Basta */
.bletter{font:800 64px/1 var(--display);text-align:center}
.bform{gap:10px}
.bfield{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
input.binput{letter-spacing:0;text-transform:none;text-align:left;font:500 17px var(--body);min-height:44px;padding:8px 12px}
.bbtn{background:var(--red);font:800 22px var(--display);letter-spacing:.06em;min-height:56px}
.bhead,.brow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center}
.bhead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.brow{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.bcat{font-weight:700;font-size:13px}
.bans{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-width:0}
.bans span{min-width:0;overflow-wrap:anywhere}
.bans span.bx{text-decoration:line-through;color:var(--muted)}
.bans i{font-size:11px;color:var(--red)}
.bans b{font-size:12px;color:var(--ok)}
.bveto{min-height:28px;padding:3px 8px;font-size:12px;background:transparent;color:var(--red);border:1px solid var(--red)}
.bveto.on{background:var(--red);color:#fff}

/* Serpientes y escaleras */
.serp{position:relative;border-radius:12px;overflow:hidden;border:3px solid var(--board)}
.sgrid{display:grid;grid-template-columns:repeat(10,1fr)}
.sc{aspect-ratio:1;background:#f6efd9;color:#7a6a45;font:700 clamp(8px,2.4vw,11px) var(--body);padding:2px 3px}
.sc.alt{background:#e7f0f7;color:#4f6578}
.sc.goal{background:var(--yellow);color:#4a3200}
.serp svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lad line{stroke:#8a5a2b;stroke-width:.9;stroke-linecap:round}
.snk{fill:none;stroke:#2f9e5b;stroke-width:2.2;stroke-linecap:round;opacity:.9}
.snkh{fill:#1f7a43}
.stok{stroke:#fff;stroke-width:.8;transition:cx .5s,cy .5s}
.stok.A{fill:var(--red)} .stok.B{fill:#e09b00}
.dicebox{display:flex;align-items:center;gap:14px}
.dicebox button{flex:1}
.die3d{width:64px;height:64px;perspective:420px;flex:none}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.15,.75,.3,1.05)}
.cube.still{transition:none}
.face{position:absolute;inset:0;background:#fff;border:1.5px solid #d8d2c4;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);padding:9px;box-shadow:inset 0 0 10px rgba(0,0,0,.12);backface-visibility:hidden}
.face i{width:11px;height:11px;border-radius:50%;background:#1b1b1b;place-self:center;visibility:hidden}
.face i.on{visibility:visible}
.face.f1 i.on{background:var(--red);width:14px;height:14px}
.f1{transform:translateZ(32px)} .f6{transform:rotateY(180deg) translateZ(32px)}
.f2{transform:rotateY(90deg) translateZ(32px)} .f5{transform:rotateY(-90deg) translateZ(32px)}
.f3{transform:rotateX(90deg) translateZ(32px)} .f4{transform:rotateX(-90deg) translateZ(32px)}
.die3d.bounce{animation:dbounce 1.15s ease-out}
@keyframes dbounce{0%{transform:translateY(-40px) scale(1.15)}45%{transform:translateY(0) scale(1)}60%{transform:translateY(-10px)}75%{transform:translateY(0)}88%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.stok.slide{animation:tslide .55s ease-in-out}
@keyframes tslide{from{transform:translate(var(--fx),var(--fy))}to{transform:translate(0,0)}}
.duel{gap:10px}
.duelrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--bg);border:2px solid transparent}
.duelrow.win{border-color:var(--ok)}
.duelrow.wait .die3d{opacity:.35}
.duelrow .who{flex:1;min-width:0}
.duelrow .who small{display:block;color:var(--muted);font-size:14px;font-weight:700}
.duelrow .pair{display:flex;gap:12px}
.duelrow .die3d{width:52px;height:52px}
.duelrow .face{padding:7px;border-radius:10px}
.duelrow .face i{width:9px;height:9px}
.duelrow .f1{transform:translateZ(26px)} .duelrow .f6{transform:rotateY(180deg) translateZ(26px)}
.duelrow .f2{transform:rotateY(90deg) translateZ(26px)} .duelrow .f5{transform:rotateY(-90deg) translateZ(26px)}
.duelrow .f3{transform:rotateX(90deg) translateZ(26px)} .duelrow .f4{transform:rotateX(-90deg) translateZ(26px)}
button.v2{background:#a2387a}
.dice3 div.rolling{animation:tumble .18s linear infinite}
@keyframes tumble{0%{transform:rotateX(0)}50%{transform:rotateX(90deg) scale(.9)}100%{transform:rotateX(0)}}
.dice3 div.landed{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cube{transition:none}.die3d.bounce,.stok.slide,.dice3 div.rolling,.dice3 div.landed{animation:none}}

/* Póker */
.felt{background:radial-gradient(ellipse at center,#1f7a4d,#145536);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;color:#fff;border:4px solid #5b3a1e}
.pkseat{display:flex;align-items:center;gap:10px;position:relative}
.pkseat > div:first-child{flex:1;min-width:0}
.pkseat b{font:600 16px var(--display)}
.pkseat small{display:block;opacity:.85;font-size:13px}
.hand{display:flex;gap:6px}
.dealer{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:#145536;font:800 11px var(--body);vertical-align:middle}
.chip{background:var(--yellow);color:#4a3200;font:800 13px var(--body);border-radius:999px;padding:3px 9px;border:2px dashed #fff}
.pkboard{display:flex;justify-content:center;gap:6px}
.pkpot{text-align:center;margin:0;font-weight:700;font-size:14px}
.card{width:46px;height:66px;border-radius:7px;background:#fff;color:#1b1b1b;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(0,0,0,.3);font-family:var(--display);line-height:1;flex:none}
.card b{font-size:20px} .card i{font-style:normal;font-size:20px}
.card.red{color:#d42c2c}
.card.sm{width:38px;height:54px} .card.sm b,.card.sm i{font-size:16px}
.card.back{background:repeating-linear-gradient(45deg,#1f4e79 0 6px,#2a6aa3 6px 12px);border:3px solid #fff}
.card.slot{background:transparent;border:2px dashed rgba(255,255,255,.35);box-shadow:none}
@media (max-width:370px){.card{width:40px;height:58px}.card b,.card i{font-size:17px}}
.pkraise{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pkraise button{min-height:44px;font-size:14px;padding:8px}
.status small{display:block;font:500 14px var(--body);color:var(--muted);margin-top:4px}

/* Picantes */
.vcard{border-radius:16px;padding:20px 16px;display:flex;flex-direction:column;gap:12px;text-align:center;color:#fff}
.vcard.verdad{background:linear-gradient(135deg,#6a2c91,#a2387a)}
.vcard.reto{background:linear-gradient(135deg,#b3263b,#e2583d)}
.vcard .label{color:rgba(255,255,255,.85)}
.vtext{font:600 22px/1.3 var(--display);margin:0;text-wrap:balance}
.vcard small{opacity:.85}
.vbtn{min-height:72px;font:800 22px var(--display)}
.vbtn.v{background:#7b3199} .vbtn.r{background:#c8323d}
.dice3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dice3.four{grid-template-columns:1fr 1fr}
.dic{font-style:normal;font-size:30px;line-height:1}
.timerbtn{background:#6a2c91;font-size:18px;min-height:56px}
.dclock{position:relative;width:180px;height:180px;margin:0 auto}
.dclock svg{width:100%;height:100%;transform:rotate(-90deg)}
.dclock .trk{fill:none;stroke:var(--line);stroke-width:10}
.dclock .prg{fill:none;stroke:#e2583d;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.dclock .dnum{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dclock .dnum b{font:800 56px/1 var(--display)}
.dclock .dnum small{color:var(--muted);font-weight:700}
.dclock.hurry .dnum b{color:#e2483d;animation:pulse .5s ease-in-out infinite alternate}
.dclock.end .dnum b{font-size:52px}
.vtip{margin:0;font-size:13px;opacity:.9}
.dice3 div{background:rgba(255,255,255,.16);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;gap:4px}
.dice3 span{font:800 18px/1.15 var(--display)}
.dice3 small{font-size:11px;text-transform:uppercase;letter-spacing:.06em}


/* ===== Diseño realista ===== */

<body>
<div class="app">
  <header>
    <h1><span class="dots"><i></i><i></i><i></i><i></i></span>Sala de Juegos</h1>
    <p class="sub">Dos jugadores, cada uno en su celular. Se conectan una vez y eligen a qué jugar.</p>
  </header>
  <main id="view"></main>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const PREFIX='conecta4-kv-';
const view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const other=p=>p==='A'?'B':'A';

let peer=null, conn=null, me=null, code=null, errMsg='', connected=false, isHost=false;
let S=null;            // estado compartido (el anfitrión manda)
let lastKey=null;      // para animar la última jugada

const GAMES={
  c4:{name:'Conecta 4',ic:'🔴',desc:'Alinea 4 fichas'},
  gato:{name:'Gato',ic:'❌',desc:'Tres en línea'},
  ppt:{name:'Piedra, papel o tijera',ic:'✂️',desc:'Al mejor de 5'},
  ahor:{name:'Ahorcado',ic:'🔤',desc:'Adivina la palabra'},
  naval:{name:'Batalla naval',ic:'🚢',desc:'Hunde su flota'},
  damas:{name:'Damas',ic:'⚫',desc:'Captura obligatoria'},
  chinas:{name:'Damas chinas',ic:'⭐',desc:'Cruza la estrella'},
  cajas:{name:'Puntos y cajas',ic:'🔲',desc:'Cierra más cuadros'},
  basta:{name:'Basta',ic:'🛑',desc:'Nombre, animal, fruta…'},
  serp:{name:'Serpientes y escaleras',ic:'🐍',desc:'Tira el dado'},
  poker:{name:'Póker',ic:'🃏',desc:'Texas Hold\'em con fichas'},
  verdad:{name:'Verdad o reto 🔥',ic:'😈',desc:'Para pareja · 18+',adult:true},
  dado:{name:'Dado picante',ic:'🎲',desc:'Para pareja · 18+',adult:true},
};
let sel=null, selKey=null, navalDraft=null; // selección local (no se comparte)
let bastaDraft={round:-1,ans:{}}, bastaSent=-1;

/* ================= Reglas ================= */
function lineWin(b,cols,rows,need){
  const at=(r,c)=>(r<0||r>=rows||c<0||c>=cols)?null:b[r*cols+c];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const p=at(r,c); if(p==='.')continue;
    for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
      const line=[r*cols+c]; let k=1;
      while(k<need&&at(r+dr*k,c+dc*k)===p){line.push((r+dr*k)*cols+c+dc*k);k++}
      if(k===need)return line;
    }
  }
  return null;
}
function dropRow(b,c){for(let r=5;r>=0;r--)if(b[r*7+c]==='.')return r;return -1}

function initGame(game,prev){
  const starter=prev?other(prev.starter):'A';
  if(game==='c4')return {board:'.'.repeat(42),turn:starter,starter,status:'playing',winner:null,winLine:null,last:null,moves:0};
  if(game==='gato')return {board:'.'.repeat(9),turn:starter,starter,status:'playing',winner:null,winLine:null,last:null,moves:0};
  if(game==='ppt')return {starter,pick:{A:null,B:null},rounds:[],wins:{A:0,B:0},status:'playing',winner:null};
  if(game==='ahor')return {starter,setter:starter,phase:'setting',word:'',guessed:'',misses:0,status:'playing',winner:null};
  if(game==='naval')return {starter,turn:starter,phase:'placing',ready:{A:false,B:false},fleet:{A:null,B:null},shots:{A:'.'.repeat(64),B:'.'.repeat(64)},last:{A:null,B:null},status:'playing',winner:null};
  if(game==='damas'){
    let b='';for(let r=0;r<8;r++)for(let c=0;c<8;c++)b+=(r+c)%2===1?(r<3?'b':r>4?'a':'.'):'.';
    return {board:b,turn:starter,starter,chain:null,last:null,soplo:null,phase:'setup',rules:{...(prev&&prev.rules||S&&S.dmRules||DM_DEFAULT)},status:'playing',winner:null};
  }
  if(game==='chinas'){
    let b='';CC.cells.forEach(cl=>b+=cl.r>=13?'A':cl.r<=3?'B':'.');
    return {board:b,turn:starter,starter,last:null,status:'playing',winner:null};
  }
  if(game==='basta')return bastaRound(prev);
  if(game==='poker'){const G={stack:{A:1000,B:1000},dealer:starter,starter,hand:0,status:'playing',winner:null};pkNewHand(G);return G}
  if(game==='verdad')return {level:prev&&prev.level||'suave',turn:starter,starter,phase:'choose',card:null,used:{},count:0,status:'playing',winner:null};
  if(game==='dado')return {level:prev&&DADO[prev.level]?prev.level:'atrevido',phase:'duel',duel:{A:null,B:null},show:{A:null,B:null},rid:{A:0,B:0},tie:null,won:null,doer:null,roll:null,round:1,count:0,status:'playing',winner:null};
  if(game==='serp')return {pos:{A:0,B:0},turn:starter,starter,roll:null,lastMove:null,status:'playing',winner:null,moves:0};
  if(game==='cajas')return {h:'.'.repeat(20),v:'.'.repeat(20),box:'.'.repeat(16),pts:{A:0,B:0},turn:starter,starter,last:null,status:'playing',winner:null};
}
function newRoom(){const score={};Object.keys(GAMES).forEach(k=>score[k]={A:0,B:0});return {game:null,v:0,g:{},score}}

/* --- Batalla naval --- */
const NAVAL_FLEET=[4,3,3,2];
function randomFleet(){
  for(let tries=0;tries<200;tries++){
    const used=new Set(), ships=[]; let ok=true;
    for(const L of NAVAL_FLEET){
      let placed=false;
      for(let t=0;t<100&&!placed;t++){
        const hor=Math.random()<.5, r=Math.floor(Math.random()*(hor?8:9-L)), c=Math.floor(Math.random()*(hor?9-L:8));
        const cells=[];for(let k=0;k<L;k++)cells.push(hor?r*8+c+k:(r+k)*8+c);
        if(cells.every(i=>!used.has(i))){cells.forEach(i=>used.add(i));ships.push(cells);placed=true}
      }
      if(!placed){ok=false;break}
    }
    if(ok)return ships;
  }
}
function validFleet(sh){
  if(!Array.isArray(sh)||sh.length!==NAVAL_FLEET.length)return false;
  const lens=sh.map(s=>Array.isArray(s)?s.length:0).sort(), want=[...NAVAL_FLEET].sort();
  if(lens.some((l,i)=>l!==want[i]))return false;
  const used=new Set();
  for(const s of sh){
    const t=[...s].map(Number).sort((a,b)=>a-b);
    if(t.some(i=>!Number.isInteger(i)||i<0||i>63||used.has(i)))return false;
    const sameRow=t.every(i=>Math.floor(i/8)===Math.floor(t[0]/8));
    const step=sameRow?1:8;
    for(let k=1;k<t.length;k++)if(t[k]-t[k-1]!==step)return false;
    t.forEach(i=>used.add(i));
  }
  return true;
}
const shipSunk=(ship,shots)=>ship.every(i=>shots[i]==='x');
function hullMap(ships){const m={};(ships||[]).forEach(s=>{const t=[...s].sort((a,b)=>a-b),hor=t.length>1&&t[1]-t[0]===1;
  t.forEach((i,k)=>{m[i]=k===0?(hor?' hs':' vs'):k===t.length-1?(hor?' he':' ve'):''})});return m}

/* --- Damas --- */
const dmOwner=ch=>ch==='.'?null:(ch.toLowerCase()==='a'?'A':'B');
const DM_DEFAULT={capture:'oblig',back:false,flying:false};
const DM_ALL=[[-1,-1],[-1,1],[1,-1],[1,1]];
function dmGen(G,p){
  const b=G.board, R=G.rules||DM_DEFAULT, caps=[], steps=[], fwd=p==='A'?-1:1;
  const inb=(r,c)=>r>=0&&r<=7&&c>=0&&c<=7;
  for(let i=0;i<64;i++){
    if(dmOwner(b[i])!==p)continue;
    if(G.chain!=null&&G.chain!==i)continue;
    const r=i>>3,c=i&7, king=b[i]===b[i].toUpperCase();
    if(king&&R.flying){
      for(const [dr,dc] of DM_ALL){
        let k=1;
        while(inb(r+dr*k,c+dc*k)&&b[(r+dr*k)*8+c+dc*k]==='.'){if(G.chain==null)steps.push({from:i,to:(r+dr*k)*8+c+dc*k,cap:null});k++}
        if(!inb(r+dr*k,c+dc*k))continue;
        const m=(r+dr*k)*8+c+dc*k; if(dmOwner(b[m])===p)continue;
        let j=k+1;
        while(inb(r+dr*j,c+dc*j)&&b[(r+dr*j)*8+c+dc*j]==='.'){caps.push({from:i,to:(r+dr*j)*8+c+dc*j,cap:m});j++}
      }
      continue;
    }
    const stepDirs=king?DM_ALL:[[fwd,-1],[fwd,1]];
    const capDirs=king||R.back?DM_ALL:[[fwd,-1],[fwd,1]];
    if(G.chain==null)for(const [dr,dc] of stepDirs){
      if(inb(r+dr,c+dc)&&b[(r+dr)*8+c+dc]==='.')steps.push({from:i,to:(r+dr)*8+c+dc,cap:null});
    }
    for(const [dr,dc] of capDirs){
      if(!inb(r+2*dr,c+2*dc))continue;
      const m=(r+dr)*8+c+dc, l=(r+2*dr)*8+c+2*dc;
      if(b[m]!=='.'&&dmOwner(b[m])!==p&&b[l]==='.')caps.push({from:i,to:l,cap:m});
    }
  }
  return {caps,steps};
}
function dmMoves(G,p){
  const {caps,steps}=dmGen(G,p);
  if(G.chain!=null)return caps;
  if((G.rules||DM_DEFAULT).capture==='oblig'&&caps.length)return caps;
  return caps.concat(steps);
}
function dmRulesText(R){
  return (R.capture==='oblig'?'Comer obligatorio':R.capture==='soplar'?'Se vale soplar':'Comer libre')+
    ' · '+(R.back?'Peones comen hacia atrás':'Peones comen solo adelante')+' · '+(R.flying?'Dama voladora':'Dama de 1 casilla');
}

/* --- Damas chinas: estrella de 121 casillas --- */
const CC=(()=>{
  const LEN=[1,2,3,4,13,12,11,10,9,10,11,12,13,4,3,2,1], cells=[], at={};
  LEN.forEach((L,r)=>{for(let k=0;k<L;k++){const x=12-(L-1)+2*k;at[r*25+x]=cells.length;cells.push({r,x})}});
  const DIRS=[[0,2],[0,-2],[1,1],[1,-1],[-1,1],[-1,-1]];
  const nb=(i,d,m=1)=>{const c=cells[i],r=c.r+d[0]*m,x=c.x+d[1]*m,k=r*25+x;return (r>=0&&r<=16&&x>=0&&x<=24&&k in at)?at[k]:-1};
  const goal={A:[],B:[]};cells.forEach((c,i)=>{if(c.r<=3)goal.A.push(i);if(c.r>=13)goal.B.push(i)});
  return {cells,DIRS,nb,goal};
})();
function ccReach(b,from){
  const out=new Set();
  for(const d of CC.DIRS){const n=CC.nb(from,d);if(n>=0&&b[n]==='.')out.add(n)}
  const seen=new Set([from]), q=[from];
  while(q.length){
    const cur=q.shift();
    for(const d of CC.DIRS){
      const m=CC.nb(cur,d), l=CC.nb(cur,d,2);
      if(m>=0&&l>=0&&b[m]!=='.'&&b[l]==='.'&&!seen.has(l)){seen.add(l);out.add(l);q.push(l)}
    }
  }
  return out;
}
function ccWon(b,p){const g=CC.goal[p];return g.every(i=>b[i]!=='.')&&g.some(i=>b[i]===p)}

/* --- Basta --- */
const BASTA_CATS=['Nombre','Apellido','Ciudad o país','Animal','Fruta o verdura','Color','Cosa'];
const BASTA_LETTERS='ABCDEFGHIJLMNOPRSTV';
function bastaRound(prev){
  const used=prev&&prev.used?prev.used:'';
  let pool=[...BASTA_LETTERS].filter(l=>!used.includes(l)); if(!pool.length)pool=[...BASTA_LETTERS];
  const letter=pool[Math.floor(Math.random()*pool.length)];
  if(prev&&prev.roundPts&&!prev.counted){
    prev.counted=true;
    prev.total={A:prev.total.A+prev.roundPts.A,B:prev.total.B+prev.roundPts.B};
    if(S&&prev.roundPts.A!==prev.roundPts.B)S.score.basta[prev.roundPts.A>prev.roundPts.B?'A':'B']++;
  }
  return {round:(prev?prev.round:0)+1,letter,used:(pool.length===BASTA_LETTERS.length?'':used)+letter,phase:'writing',
    ans:{A:null,B:null},veto:{A:[],B:[]},stopper:null,total:prev&&prev.total?{...prev.total}:{A:0,B:0},pts:null,status:'playing',winner:null};

      if(G.ans.A&&G.ans.B){G.phase='review';G.status='done';G.winner=null;bastaFinish(G)}

    }
    if(a.k==='veto'&&G.phase==='review'){

  }
  if(a.k==='adult'&&GAMES[S.game].adult){S.adult=S.adult||{A:false,B:false};S.adult[p]=true;return commit()}
  if(S.game==='poker'){
    if(a.k==='pknext'&&G.phase==='handover'&&G.status==='playing'){G.dealer=other(G.dealer);pkNewHand(G);return commit()}
    if(G.phase!=='betting'||G.toAct!==p)return;
    const o=other(p);

      G.result={winner:o,pot:G.pot,show:false,fold:p}; G.pot=0; G.lastAct={p,t:'fold'}; pkEndHand(G); return commit();
    }

      if(G.bet[p]<G.bet[o]){pkCloseStreet(G);return commit()}      // pagó todo lo que tenía

      const to=Math.floor(a.to), maxTo=G.bet[p]+G.stack[p], minTo=G.bet[o]+G.minRaise;
      if(!(to>G.bet[o])||to>maxTo||(to<minTo&&to!==maxTo)||G.stack[o]===0)return;
      G.minRaise=Math.max(G.minRaise,to-G.bet[o]); G.stack[p]-=to-G.bet[p]; G.bet[p]=to;

    else G.toAct=o;
    return commit();
  }
  if(S.game==='verdad'){
    if(!S.adult||!S.adult.A||!S.adult.B)return;
    if(a.k==='vlevel'&&VR[a.level]&&G.phase==='choose'){G.level=a.level;return commit()}
    if(a.k==='vpick'&&G.phase==='choose'&&G.turn===p&&(a.t==='verdad'||a.t==='reto')){
      const list=VR[G.level][a.t], key=G.level+a.t, used=G.used[key]||[];
      let pool=list.map((_,i)=>i).filter(i=>!used.includes(i)); if(!pool.length){pool=list.map((_,i)=>i);G.used[key]=[]}
      const i=pool[Math.floor(Math.random()*pool.length)];
      G.used[key]=[...(G.used[key]||[]),i]; G.card={t:a.t,text:list[i],level:G.level,who:p}; G.phase='card'; return commit();
    }
    if(a.k==='vdone'&&G.phase==='card'&&G.turn===p){G.lastDone={who:p,skip:!!a.skip,t:G.card.t};G.phase='choose';G.card=null;G.count++;G.turn=other(p);return commit()}
    return;
  }
  if(S.game==='dado'){
    if(!S.adult||!S.adult.A||!S.adult.B)return;
    if(a.k==='body'&&(a.v==='h'||a.v==='m')){S.body=S.body||{A:null,B:null};S.body[p]=a.v;return commit()}
    if(a.k==='dlevel'&&DADO[a.level]&&G.phase!=='show'){G.level=a.level;return commit()}
    if(a.k==='dtimer'&&G.phase==='show'&&G.roll&&!G.timer){G.timer={n:G.roll.n,dur:G.roll.t};return commit()}
    if(a.k==='dduel'&&G.phase==='duel'&&!G.duel[p]){
      const d=()=>1+Math.floor(Math.random()*6);
      G.duel[p]=[d(),d()]; G.show[p]=G.duel[p]; G.rid[p]++;
      if(G.duel.A&&G.duel.B){
        const sa=G.duel.A[0]+G.duel.A[1], sb=G.duel.B[0]+G.duel.B[1];
        if(sa===sb){G.tie={A:sa,B:sb};G.duel={A:null,B:null}}
        else{G.tie=null;G.won=sa>sb?'A':'B';G.phase='choose'}
      }
      return commit();
    }
    if(a.k==='dchoose'&&G.phase==='choose'&&G.won===p&&(a.who==='me'||a.who==='other')){
      G.doer=a.who==='me'?p:other(p); G.phase='roll'; return commit();
    }
    if(a.k==='droll'&&G.phase==='roll'&&G.won===p){
      const L=DADO[G.level], r=n=>Math.floor(Math.random()*n);
      const T=L.t||DADO_T, Z=dadoZonas(L,S.body&&S.body[other(G.doer)]); G.count++; G.timer=null; const ac=L.acc[r(L.acc.length)], pen=ac==='Penetrar'&&L.pos; G.roll={doer:G.doer,acc:ac,zona:pen?null:Z[r(Z.length)],pos:pen?L.pos[r(L.pos.length)]:null,t:T[r(T.length)],n:G.count}; G.phase='show'; return commit();
    }

      Object.assign(G,{phase:'duel',duel:{A:null,B:null},show:{A:null,B:null},tie:null,won:null,doer:null,timer:null,round:G.round+1});
      return commit();

    if(G.status!=='playing'||G.turn!==p)return;

    G.pos[p]=to; G.roll=d; G.moves++; G.lastMove={p,from,mid,to,d};

  if(S.game==='cajas'&&a.k==='line'){
    if(G.status!=='playing'||G.turn!==p)return;
    const t=a.t==='h'?'h':'v', i=a.i|0; if(i<0||i>19||G[t][i]!=='.')return;
    G[t]=G[t].slice(0,i)+p+G[t].slice(i+1); G.last=t+i;
    let got=0;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      const k=r*4+c; if(G.box[k]==='.'&&cajaDone(G,r,c)){G.box=G.box.slice(0,k)+p+G.box.slice(k+1);got++}
    }
    G.pts[p]+=got;
    if(!G.box.includes('.')){G.status='done';G.winner=G.pts.A===G.pts.B?'draw':(G.pts.A>G.pts.B?'A':'B');if(G.winner!=='draw')S.score.cajas[G.winner]++}

}

/* Lo que hace este celular cuando el jugador toca algo */
function doAct(a){

}

/* ================= Conexión ================= */
function newCode(){let s='';const a=new Uint32Array(4);crypto.getRandomValues(a);for(const n of a)s+=ALPH[n%ALPH.length];return s}
function shareUrl(c){return location.origin+location.pathname+'?sala='+c}

function host(tries=0){
  if(typeof Peer==='undefined'){errMsg='No se pudo cargar el módulo de conexión. Revisa tu internet.';return renderHome()}
  errMsg=''; code=newCode(); me='A'; isHost=true; S=newRoom();
  renderMsg('Creando sala…');
  peer=new Peer(PREFIX+code);
  peer.on('open',()=>renderWaiting());
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&tries<4){peer.destroy();return host(tries+1)}
    if(!connected&&!conn){errMsg='No se pudo crear la sala ('+e.type+'). Intenta de nuevo.';reset()}
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',c=>{
    if(conn&&conn.open){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300)});return}
    attach(c);
    c.on('open',()=>send({t:'state',S}));
  });
}
function join(raw){
  const c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==4){errMsg='Escribe el código de 4 caracteres.';return renderHome()}
  if(typeof Peer==='undefined'){errMsg='No se pudo cargar el módulo de conexión. Revisa tu internet.';return renderHome()}
  try{conn&&conn.close()}catch(e){} try{peer&&peer.destroy()}catch(e){}
  errMsg=''; code=c; me='B'; isHost=false;
  renderMsg('Conectando a la sala '+c+'…');
  peer=new Peer();
  peer.on('open',()=>{
    attach(peer.connect(PREFIX+c,{reliable:true}));
    setTimeout(()=>{if(!connected&&!S){errMsg='No se encontró la sala '+c+'. Revisa el código o que tu rival siga en la pantalla de espera.';reset()}},12000);
  });
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){if(S){connected=false;return render()}errMsg='No existe la sala '+c+'. Revisa el código.';return reset()}
    if(!connected&&!S){errMsg='No se pudo conectar ('+e.type+').';reset()}
  });
}
function attach(c){
  conn=c;
  c.on('open',()=>{connected=true;try{history.replaceState(null,'',location.pathname+'?sala='+code)}catch(e){} if(S)render()});
  c.on('data',onData);
  c.on('close',()=>{if(conn===c){connected=false;render()}});
  c.on('error',()=>{});
}
function send(m){try{conn&&conn.open&&conn.send(m)}catch(e){}}
function onData(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='full'){errMsg='Esa sala ya tiene dos jugadores.';return reset()}
  if(!isHost&&m.t==='state'&&m.S){S=m.S;render()}
  if(isHost&&m.t==='act')act('B',m.a);
}
function reset(){
  try{conn&&conn.close()}catch(e){} try{peer&&peer.destroy()}catch(e){}
  peer=conn=null;me=null;code=null;S=null;connected=false;isHost=false;lastKey=null;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  renderHome();
}

/* ---- Batalla naval ---- */
function renderNaval(){
  const G=S.g.naval, op=other(me);
  let body='';
  if(G.phase==='placing'){
    if(!G.ready[me]){
      if(!navalDraft)navalDraft=randomFleet();
      const cells=new Set(navalDraft.flat()), hm=hullMap(navalDraft);
      body=`<section class="panel"><h2>Acomoda tu flota</h2>
        <p class="msg">4 barcos: uno de 4, dos de 3 y uno de 2. Toca “Otra posición” hasta que te guste.</p>
        <div class="bn">${Array.from({length:64},(_,i)=>`<div class="sq${cells.has(i)?' ship'+hm[i]:''}"></div>`).join('')}</div>
        <div class="row"><button class="ghost" id="shuffle">🔀 Otra posición</button><button id="ready" ${connected?'':'disabled'}>¡Listo!</button></div></section>`;
    }else{
      body=`<section class="panel"><p class="status">Esperando a que tu rival acomode sus barcos…</p></section>`;
    }
  }else{
    const myTurn=G.status==='playing'&&G.turn===me&&connected;
    const myShots=G.shots[me], hisShots=G.shots[op];
    const enemySunk=new Set(), mySunk=new Set();
    let enemySunkN=0,mySunkN=0;
    G.fleet[op].forEach(s=>{if(shipSunk(s,myShots)){enemySunkN++;s.forEach(i=>enemySunk.add(i))}});
    G.fleet[me].forEach(s=>{if(shipSunk(s,hisShots)){mySunkN++;s.forEach(i=>mySunk.add(i))}});
    const done=G.status==='done';
    const enemyShips=new Set(done?G.fleet[op].flat():[]), hmE=hullMap(G.fleet[op]), hmM=hullMap(G.fleet[me]);
    const attack=Array.from({length:64},(_,i)=>{
      const s=myShots[i]; let cls='sq';
      if(enemySunk.has(i))cls+=' sunk'; else if(s==='x')cls+=' hit'; else if(s==='o')cls+=' miss'; else if(enemyShips.has(i))cls+=' ship'+hmE[i];
      if(G.last[me]===i)cls+=' lastshot';
      const can=myTurn&&s==='.';
      return can?`<button class="${cls} can" data-i="${i}" aria-label="Disparar a ${'ABCDEFGH'[i>>3]}${(i&7)+1}"></button>`:`<div class="${cls}"></div>`;
    }).join('');
    const mine=new Set(G.fleet[me].flat());
    const defend=Array.from({length:64},(_,i)=>{
      const s=hisShots[i]; let cls='sq'+(mine.has(i)?' ship'+hmM[i]:'');
      if(mySunk.has(i))cls+=' sunk'; else if(s==='x')cls+=' hit'; else if(s==='o')cls+=' miss';
      if(G.last[op]===i)cls+=' lastshot';
      return `<div class="${cls}"></div>`}).join('');
    let status;
    if(done)status=resultText(G);
    else if(!connected)status='Esperando a tu rival…';
    else status=myTurn?'Te toca disparar':'Tu rival está disparando…';
    body=`<p class="status" aria-live="polite">${status}</p>
      <p class="msg center">Si le atinas, vuelves a tirar.</p>
      <section class="panel"><div class="fleetinfo"><b>Mar del rival</b><span>Hundidos: ${enemySunkN} de ${NAVAL_FLEET.length}</span></div>
        <div class="bn">${attack}</div></section>
      <section class="panel"><div class="fleetinfo"><b>Tu flota</b><span>Te hundieron: ${mySunkN} de ${NAVAL_FLEET.length}</span></div>
        <div class="bn small">${defend}</div></section>`;
  }
  view.innerHTML=`<div class="stack">${head('🚢 Batalla naval')}${body}${tail(G)}</div>`;
  const sh=document.getElementById('shuffle'); if(sh)sh.onclick=()=>{navalDraft=randomFleet();render()};
  const rd=document.getElementById('ready'); if(rd)rd.onclick=()=>{const f=navalDraft;navalDraft=null;doAct({k:'fleet',ships:f})};
  view.querySelectorAll('.bn .sq.can').forEach(b=>b.onclick=()=>doAct({k:'shot',i:+b.dataset.i}));
  if(G.status==='done')navalDraft=null;
  wireCommon();
}

/* ---- Damas ---- */
function renderDamas(){
  const G=S.g.damas;
  if(G.phase==='setup'){
    const R=G.rules, opt=(name,val,label,desc)=>{
      const on=R[name]===val;
      return `<button class="${on?'':'ghost'} dmopt" data-n="${name}" data-v="${JSON.stringify(val).replace(/"/g,'&quot;')}" ${connected?'':'disabled'} aria-pressed="${on}">${label}${desc?`<small>${desc}</small>`:''}</button>`};
    view.innerHTML=`<div class="stack">${head('⚫ Damas')}
      <section class="panel"><h2>Reglas de la partida</h2>
        <p class="msg">Cualquiera de los dos puede cambiarlas. Las ven los dos al mismo tiempo.</p>
        <div class="label">Comer</div>
        <div class="opts">${opt('capture','oblig','Obligatorio','Si puedes comer, tienes que comer')}${opt('capture','libre','Libre','Comes solo si quieres')}${opt('capture','soplar','Soplar','Si no come pudiendo, le quitas la ficha')}</div>
        <div class="label">Los peones comen hacia atrás</div>
        <div class="opts two">${opt('back',false,'No')}${opt('back',true,'Sí')}</div>
        <div class="label">Dama coronada</div>
        <div class="opts two">${opt('flying',false,'1 casilla','Se mueve de una en una')}${opt('flying',true,'Voladora','Avanza varias casillas')}</div>
      </section>
      <button id="dmstart" ${connected?'':'disabled'}>Empezar partida</button>
      ${footer()}</div>`;
    view.querySelectorAll('.dmopt').forEach(b=>b.onclick=()=>{
      const nr={...G.rules,[b.dataset.n]:JSON.parse(b.dataset.v)}; doAct({k:'dmrules',rules:nr})});
    document.getElementById('dmstart').onclick=()=>doAct({k:'dmstart'});
    wireCommon(); return;
  }
  const myTurn=G.status==='playing'&&G.turn===me&&connected;
  const moves=myTurn?dmMoves(G,me):[];
  const blowable=new Set(myTurn&&G.chain==null&&G.soplo?G.soplo:[]);
  if(G.chain!=null&&myTurn)sel=G.chain;
  const movable=new Set(moves.map(m=>m.from));
  const targets=new Set(moves.filter(m=>m.from===sel).map(m=>m.to));
  const last=new Set(G.last||[]);
  const flip=me==='B';
  let sq='';
  for(let k=0;k<64;k++){
    const i=flip?63-k:k, ch=G.board[i], o=dmOwner(ch), dk=((i>>3)+(i&7))%2===1;
    let cls='sq'+(dk?' dk':'');
    if(movable.has(i))cls+=' mov'; if(sel===i)cls+=' sel'; if(targets.has(i))cls+=' tgt'; if(last.has(i))cls+=' last';
    if(blowable.has(i))cls+=' blow'; if(G.blown===i)cls+=' blown';
    const pc=o?`<span class="pc ${o}">${ch===ch.toUpperCase()?'♛':''}</span>`:'';
    const tap=movable.has(i)||targets.has(i)||blowable.has(i);
    sq+=tap?`<button class="${cls}" data-i="${i}">${pc}</button>`:`<div class="${cls}">${pc}</div>`;
  }
  const count=p=>[...G.board].filter(ch=>dmOwner(ch)===p).length;
  const R=G.rules;
  let status=turnText(G);
  if(myTurn){
    if(G.chain!=null)status=R.capture==='oblig'?'¡Sigue comiendo!':'Puedes seguir comiendo';
    else if(blowable.size)status='Tu rival no comió: ¡puedes soplarle!';
    else if(R.capture==='oblig'&&moves.some(m=>m.cap!=null))status='Te toca: tienes que comer';
  }else if(G.status==='playing'&&connected&&G.soplo&&G.soplo.length)status='No comiste… tu rival puede soplarte';
  const endBtn=myTurn&&G.chain!=null&&R.capture!=='oblig'?'<button class="ghost" id="dmend">Terminar mi turno</button>':'';
  const blowHint=blowable.size?'<p class="msg center">Toca la ficha marcada del rival para quitársela, o juega normal.</p>':'';
  view.innerHTML=`<div class="stack">${head('⚫ Damas')}
    ${playersBar(G,'<span class="disc A" style="width:22px;height:22px"></span>','<span class="disc" style="width:22px;height:22px;background:#222;box-shadow:inset 0 2px 2px rgba(255,255,255,.3)"></span>')}
    <p class="status" aria-live="polite">${status}</p>
    ${blowHint}
    <div class="dm">${sq}</div>
    ${endBtn}
    <p class="msg center">Fichas: tú ${count(me)} · rival ${count(other(me))}<br>${dmRulesText(R)}</p>
    ${tail(G)}</div>`;
  view.querySelectorAll('.dm button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(blowable.has(i))doAct({k:'soplar',i});
    else if(targets.has(i))doAct({k:'dm',from:sel,to:i});
    else if(G.chain==null){sel=sel===i?null:i;render()}
  });
  const eb=document.getElementById('dmend'); if(eb)eb.onclick=()=>doAct({k:'dmend'});
  wireCommon();
}

  let boxes='',lines='',dots='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const o=G.box[r*4+c];
    if(o!=='.')boxes+=`<rect class="db-box${o}" x="${P(c)+1}" y="${P(r)+1}" width="18" height="18" rx="2"/><text class="db-lbl" x="${P(c)+10}" y="${P(r)+10}">${o===me?'Tú':'R'}</text>`;
  }
  const line=(t,i,x1,y1,x2,y2)=>{
    const o=G[t][i];
    if(o!=='.')return `<line class="db-line db-${o}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${G.last===t+i?' stroke-dasharray="none" style="filter:drop-shadow(0 0 1.5px currentColor)"':''}/>`;
    if(!myTurn)return '';
    return `<line class="db-hit" data-t="${t}" data-i="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="db-ghost" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  };
  for(let r=0;r<5;r++)for(let c=0;c<4;c++)lines+=line('h',r*4+c,P(c),P(r),P(c+1),P(r));
  for(let r=0;r<4;r++)for(let c=0;c<5;c++)lines+=line('v',r*5+c,P(c),P(r),P(c),P(r+1));
  for(let r=0;r<5;r++)for(let c=0;c<5;c++)dots+=`<circle class="db-dot" cx="${P(c)}" cy="${P(r)}" r="1.8"/>`;

  wireCommon();

const FACE_ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};

function spinDieTo(id,v){

function serpXY(n){const r=Math.floor((n-1)/10),c=r%2===0?(n-1)%10:9-(n-1)%10;return [c*10+5,(9-r)*10+5]}

    let rungs='';const nr=Math.max(2,Math.round(len/5));for(let k=1;k<nr;k++){const t=k/nr;rungs+=`<line x1="${x1+dx*t+ox}" y1="${y1+dy*t+oy}" x2="${x1+dx*t-ox}" y2="${y1+dy*t-oy}"/>`}

const cardHtml=(c,small)=>{if(!c)return `<span class="card back${small?' sm':''}"></span>`;const rk=c[0]==='T'?'10':c[0],su=SUIT[c[1]];

function renderPoker(){
  const G=S.g.poker, op=other(me), myTurn=G.phase==='betting'&&G.toAct===me&&connected;

  const actTxt=la=>!la?'':(la.p===me?'Tú: ':'Rival: ')+({fold:'se retiró',check:'pasó',call:'igualó',raise:'subió a '+la.x,allin:'¡all-in! ('+la.x+')'})[la.t];

      num.textContent=Math.ceil(left); prg.setAttribute('stroke-dashoffset',(326.7*(1-left/dTimer.dur)).toFixed(1));
      if(left<=5&&left>0)box.classList.add('hurry');
      if(left<=0){clearInterval(dTimer.iv);num.textContent='⏰';lab.textContent='¡Tiempo!';box.classList.remove('hurry');box.classList.add('end');
        if(!dTimer.done){dTimer.done=true;beep(3)}}
    };
    tick(); if(!dTimer.done)dTimer.iv=setInterval(tick,200);
  }
  if(fresh){
    const L=DADO[G.level], Z=dadoZonas(L,B[other(R.doer)]), pools=[L.acc,...(R.zona?[Z]:[]),...(R.pos?[L.pos]:[]),(L.t||DADO_T).map(fmtT)], finals=[R.acc,...(R.zona?[R.zona]:[]),...(R.pos?[R.pos]:[]),fmtT(R.t)];
    const tb=document.getElementById('dtimer'); if(tb){tb.disabled=true;dadoTimers.push(setTimeout(()=>{tb.disabled=!connected},700+450*3))}
    const boxes=[...view.querySelectorAll('.dice3 > div')];
    const st=view.querySelector('.status'), btn=document.getElementById('dnext'), finalStatus=st?st.textContent:'';
    if(st)st.textContent='🎲 Rodando…'; if(btn)btn.disabled=true;
    boxes.forEach((bx,i)=>{
      const sp=bx.querySelector('span'), ic=bx.querySelector('.dic'), last=i===boxes.length-1; bx.classList.add('rolling');
      const iv=setInterval(()=>{const w=pools[i][Math.floor(Math.random()*pools[i].length)];sp.textContent=w;if(ic&&!last)ic.textContent=dIc(w)},90);
      dadoTimers.push(iv);
      dadoTimers.push(setTimeout(()=>{clearInterval(iv);sp.textContent=finals[i];if(ic&&!last)ic.textContent=dIc(finals[i]);bx.classList.remove('rolling');bx.classList.add('landed');
        if(i===boxes.length-1){if(st)st.textContent=finalStatus;if(btn)btn.disabled=!connected}},700+450*i));
    });
  }
  wireCommon();
}

/* ================= Arranque ================= */
const sala=new URLSearchParams(location.search).get('sala');
if(sala&&/^[A-Za-z0-9]{4}$/.test(sala))join(sala); else renderHome();
</script>
